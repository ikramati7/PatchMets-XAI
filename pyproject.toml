[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcam-mets-explain"
version = "0.1.0"
description = "Patch-level lymph-node metastasis classifier with Grad-CAM explanations (research demo)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ikrame" }]
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "matplotlib>=3.8",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16"]
app = ["streamlit>=1.32"]
dev = ["pytest>=7.4"]

[project.scripts]
pcam-check-env = "pcam_mets_explain.check_env:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
